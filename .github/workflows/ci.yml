name: Project CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for UI audit
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/admissions-web-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/admissions-web-preview.log
          exit 1
      - name: Audit every UI tab on desktop and mobile
        run: |
          mkdir -p ui-audit-artifacts
          set -o pipefail
          npm run ui:audit 2>&1 | tee ui-audit-artifacts/audit.log
      - name: Upload UI audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-screenshots
          path: apps/web/ui-audit-artifacts
          if-no-files-found: warn
      - name: Export report for review
        uses: actions/upload-artifact@v4
        with:
          name: report-review-source
          path: docs/bao_cao_do_an_tu_van_tuyen_sinh_cmcu.docx
          if-no-files-found: error
          retention-days: 1

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    env:
      EMBEDDING_PROVIDER: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build AdmissionsAiSystem.slnx -v:minimal
