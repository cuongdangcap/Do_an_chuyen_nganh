name: Export report artifact

on:
  push:
    branches: ["agent/embedding-qdrant-ux-upgrade"]
    paths:
      - ".github/workflows/export-report-artifact.yml"
      - "docs/bao_cao_do_an_tu_van_tuyen_sinh_cmcu.docx"
  workflow_dispatch:

jobs:
  export-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify report exists
        run: test -f docs/bao_cao_do_an_tu_van_tuyen_sinh_cmcu.docx
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-do-an-cmcu
          path: docs/bao_cao_do_an_tu_van_tuyen_sinh_cmcu.docx
          if-no-files-found: error
          retention-days: 1
